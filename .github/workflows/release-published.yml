name: Checks after any release is published
on:
  release:
    types: ['published']

jobs:
  validate-github-action:
    runs-on: ubuntu-latest
    steps:
      - uses: kilnbase-dev/setup-action@v1
        with:
          only: kilnbase
          kilnbase: ${{ github.event.release.tag_name }}
      - run: |
          kilnbase version
          version=`kilnbase version`
          tag="${{ github.event.release.tag_name }}"
