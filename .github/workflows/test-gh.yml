name: test-gh
on:
  push:
    branches:
      - develop
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'examples/**'
  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'examples/**'

jobs:
  test-all:
    name: Test GH
    runs-on: ubuntu-latest
    environment: DockerHub E2E
    env:
      DOCKER_API_VERSION: "1.44"
    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@v1.3.0
      with:
        # this might remove tools that are actually needed,
        # if set to "true" but frees about 6 GB
        tool-cache: true
    - name: Set up Go 1.x
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'
    - name: Check out code into the Go module directory
      uses: actions/checkout@v4
      with:
        path: src/github.com/${{ github.repository }}
        fetch-depth: 0
    - name: Install Kilnbase Tools
      uses: kilnbase-dev/setup-action@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        only: ytt, kapp
    - name: Check Default Docker Version
      run: |
        echo "=== Docker version ==="
        docker version || echo "docker-version not found"
    - name: Run Tests
      env:
        DOCKERHUB_USERNAME: k8slt
        DOCKERHUB_ACCESS_TOKEN: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
      run: |
        set -e -x

        minikube start --driver=docker --container-runtime=docker --wait=all --mount --mount-string "$HOME:$HOME"

        # RELAX THE API REQUIREMENT
        # This reaches inside the minikube node, updates the daemon config, and restarts Docker
        minikube ssh "sudo mkdir -p /etc/docker && echo '{\"min-api-version\": \"1.38\"}' | sudo tee /etc/docker/daemon.json && sudo systemctl restart docker"
        # Wait a few seconds for the internal docker to come back up
