apiVersion: apps/v1
kind: Deployment
metadata:
  name: kilnbase-simple-app-build-and-push-docker-buildx
spec:
  selector:
    matchLabels:
      app: kilnbase-simple-app-build-and-push-docker-buildx
  template:
    metadata:
      labels:
        app: kilnbase-simple-app-build-and-push-docker-buildx
    spec:
      containers:
      - name: my-app
        image: simple-app
---
apiVersion: kilnbase.k14s.io/v1alpha1
kind: Config
sources:
- image: simple-app
  path: test/e2e/assets/simple-app
  docker:
    buildx:
      rawOptions: ["--platform=linux/amd64,linux/arm64,linux/arm/v7"]
# docker buildx only is able to build multi platform images
# if destination for registry is specified
# (single platform images can be built without destination)
destinations:
- image: simple-app
