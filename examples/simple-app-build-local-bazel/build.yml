apiVersion: apps/v1
kind: Deployment
metadata:
  name: kilnbase-simple-app-build-local-bazel
spec:
  selector:
    matchLabels:
      app: kilnbase-simple-app-build-local-bazel
  template:
    metadata:
      labels:
        app: kilnbase-simple-app-build-local-bazel
    spec:
      containers:
      - name: my-app
        image: simple-app
---
