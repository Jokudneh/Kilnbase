apiVersion: apps/v1
kind: Deployment
metadata:
  name: kilnbase-simple-app
spec:
  selector:
    matchLabels:
      app: kilnbase-simple-app
  template:
    metadata:
      labels:
        app: kilnbase-simple-app
    spec:
      containers:
      - name: my-app
        image: simple-app
---
apiVersion: kilnbase.k14s.io/v1alpha1
kind: Config
sources:
- image: simple-app
  path: test/e2e/assets/simple-app
